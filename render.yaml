services:
  - type: web
    name: portal-pedidos-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: portal-pedidos-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: NODE_ENV
        value: production
  - type: web
    name: portal-pedidos-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://portaldepedidosdoparceiro.onrender.com

databases:
  - name: portal-pedidos-db
    plan: free
