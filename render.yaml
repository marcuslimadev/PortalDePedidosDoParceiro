services:
  - type: web
    name: portal-pedidos-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: portal-pedidos-db
          property: connectionString
      - key: PGSSLMODE
        value: require
  - type: web
    name: portal-pedidos-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

databases:
  - name: portal-pedidos-db
    plan: free
